<div class="tutorial-layout">
   <aside class="tutorial-sidebar">
      <h2>FastGrid tutorials<br />Angular</h2>
      <nav class="tutorial-menu">
         @for(group of tutorialGroups; track group.path) {
            <section class="tutorial-group">
               <h3 class="tutorial-group-title">{{ group.title }}</h3>
               <div class="tutorial-group-links">
                  @for(item of group.items; track item.fullPath) {
                     <a [routerLink]="'/'+item.fullPath" routerLinkActive="active" class="tutorial-link">
                        {{ item.title }}
                     </a>
                  }
               </div>
            </section>
         }
      </nav>
   </aside>

   <main class="tutorial-content Tutorial">
      <router-outlet />
   </main>
</div>
