<!DOCTYPE html>
<html>
   <head>
      <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"/>      
      <script src="../../../Grid/FGridE.js"> </script>
      <script src="GridEStandalone.js"> </script>
      <link href="../../Tutorial.css" rel="stylesheet" />
   </head>
   <body class="Tutorial" style="padding-bottom:0px;">
      <div class="Path"><script>document.getElementsByClassName("Path")[0].innerHTML = location.href.replace(/(.*)\/F?(Examples\/)([^\/]+)\/([^\/]+)\/([^\/]+)$/,"$2<b>$3</b>/<i>$4</i>/$5").replace(/([^<]|^)(\/|\.)/g,"$1<u>$2</u>").replace(/[?#].*$/,"");</script></div>
      <h1>4. Large example with detail TreeGrid Gantt chart</h1>
      <h5>Using FastGrid together with TreeGrid Gantt chart. Only HTML without saving changes.</h5>

      <fast-grid src="['GanttDataDef.js','../03-Pivot/Data/PivotData100000.js']"></fast-grid>

      <div style="height:200px;margin-top:16px;">
         <bdo Layout_Url="GanttDef.js" SuppressMessage="1"></bdo>
      </div>

      <script>
      FGrid.OnLoadError = function(G,source,code,message,index){ //. Called when trying to download large data that are not included in the base examples package
         if(index==1&&(code==-6||code==404)) alert("The large data '"+source+"' was not found, you need to download this file in separate package from www.treegrid.com" );
         }
      Grids.OnRenderFinish = function(G){ //. Called after the TreeGrid Gantt chart is ready on start, shows here the focused row from FastGrid source
         var F = FGrid.Grids[0], A = F.GetFocus(); FGrid.OnFocus(F,A[0],A[1]);
         }
      </script>
   </body>
</html>
