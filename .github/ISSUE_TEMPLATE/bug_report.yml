name: Bug report
description: Report a reproducible problem in a FastGrid wrapper or generator
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: npm package
      placeholder: fastgrid-angular
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 3.2.0
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: FastGrid/FastSheet runtime version
      placeholder: "3.2"
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: "22.0.8"
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal repository or exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
